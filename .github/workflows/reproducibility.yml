name: Reproducibility
# Proves every authoritative text re-derives from its stored original via scripts/extract.py.
# Needs a real extractor toolchain (poppler), so it's separate from the fast pure-python validate gate.
on: [push, pull_request, workflow_dispatch]
jobs:
  reproduce:
    # (a) PIN BY IMAGE (issue #7). This job ran on `ubuntu-latest` with an unpinned
    # `apt-get install poppler-utils`, so the pinned extractor version declared in scripts/extract.py
    # (22.02.0) was a statement about the corpus that CI did not actually test. Ubuntu 22.04 carries
    # Poppler 22.02.0, so pinning the image makes the job test the recorded toolchain.
    # NOTE the enforcement has an expiry: GitHub retires image labels, and package revisions move
    # within one. The assert step below is the tripwire for when that happens.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - name: Install extractor toolchain + deps
        run: |
          sudo apt-get update && sudo apt-get install -y poppler-utils
          pip install -r scripts/requirements.txt
      # (d) ASSERT, DON'T RELY ON THE IMAGE (issue #7). Reads the pin from extract.py, so there is one
      # source of truth rather than a copy in YAML. A toolchain move must be a loud, dated failure:
      # otherwise every historical MISMATCH becomes ambiguous between "the record changed" and "the
      # runner changed", which is how a locally-built Poppler 26.01.0 produced a spurious mismatch on
      # a record nobody had touched (whitespace differences in mixed CJK/Latin text).
      - name: Assert the toolchain is the PINNED one (fail closed if the runner moves)
        run: |
          python3 - <<'PY'
          import sys
          sys.path.insert(0, "scripts")
          import extract as E
          ver = E.poppler_version()
          print(f"pdftotext (Poppler) {ver}  ·  pinned {E.PINNED_POPPLER}")
          if ver != E.PINNED_POPPLER:
              sys.exit(f"FAIL: the runner's Poppler is {ver}, but this corpus pins {E.PINNED_POPPLER}. "
                       "Byte-exact reproduction of PDF-sourced records is guaranteed only against the "
                       "pinned version, so every MISMATCH below would be ambiguous between 'the record "
                       "changed' and 'the toolchain moved'. Pin this job to an image carrying the pinned "
                       "Poppler (issue #7), or re-derive the affected records deliberately and move the "
                       "pin in the same change.")
          print("OK: toolchain matches the pin — so a MISMATCH below means the RECORD changed.")
          PY
      - name: Verify content re-derivation from originals
        run: python3 scripts/repro_gate.py  # walks authoritative/, applies scripts/repro-policy.json; exits non-zero on any mismatch/error/uncovered-over-ceiling
