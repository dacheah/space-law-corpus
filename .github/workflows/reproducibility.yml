name: Reproducibility
# Proves every authoritative text re-derives from its stored original via scripts/extract.py.
# Needs a real extractor toolchain (poppler), so it's separate from the fast pure-python validate gate.
on: [push, pull_request, workflow_dispatch]
jobs:
  reproduce:
    # (a) PIN BY IMAGE (issue #7). This job ran on `ubuntu-latest` with an unpinned
    # `apt-get install poppler-utils`, so the pinned extractor version declared in scripts/extract.py
    # (22.02.0) was a statement about the corpus that CI did not actually test. Ubuntu 22.04 carries
    # Poppler 22.02.0, so pinning the image makes the job test the recorded toolchain.
    # NOTE the enforcement has an expiry: GitHub retires image labels, and package revisions move
    # within one. The assert step below is the tripwire for when that happens.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - name: Install extractor toolchain + deps
        run: |
          sudo apt-get update && sudo apt-get install -y poppler-utils
          pip install -r scripts/requirements.txt
      # (e) ENGINE IDENTITY (issue #7). scripts/verify_engine.py existed in this repo but NO workflow
      # referenced it, so scripts/extract.py — the sole version-pinned extractor — could have changed
      # with no gate noticing. Engine files are hashed; a deliberate change means regenerating
      # scripts/MANIFEST.sha256 in the same commit.
      - name: Engine identity (no engine file added, modified or removed)
        run: python3 scripts/verify_engine.py
      # (d) ASSERT, DON'T RELY ON THE IMAGE (issue #7). A toolchain move must be a loud, dated failure:
      # otherwise every historical MISMATCH becomes ambiguous between "the record changed" and "the
      # runner changed", which is how a locally-built Poppler 26.01.0 produced a spurious mismatch on
      # a record nobody had touched (whitespace differences in mixed CJK/Latin text).
      #
      # TWO ATTESTATION MODELS exist in this portfolio, and reading only one is how the first version
      # of this step went RED on this corpus — which attests correctly, just differently:
      #   * deep-seabed declares a module-level pin (extract.py: PINNED_POPPLER).
      #   * THIS corpus records the toolchain PER RECIPE instead: extraction/<corpus_id>/<version_id>.json
      #     carries `extractor.toolchain`, written at calibrate time. That is the stronger form — the
      #     attestation sits with the record it applies to — and it is issue #7's option (e) already in
      #     place. Both are handled below, and a discrepancy in either FAILS.
      - name: Assert the toolchain matches what these records were derived under (fail closed)
        run: |
          python3 - <<'PY'
          import glob, json, sys
          sys.path.insert(0, "scripts")
          import extract as E
          ver = E.poppler_ver() if hasattr(E, "poppler_ver") else E.poppler_version()
          pin = getattr(E, "PINNED_POPPLER", None)
          if pin:
              print(f"module pin: poppler {pin}  ·  runtime: poppler {ver}")
              if ver != pin:
                  sys.exit(f"FAIL: the runner's Poppler is {ver}, but this corpus pins {pin}. "
                           "Byte-exact reproduction is guaranteed only against the pinned version, so "
                           "every MISMATCH below would be ambiguous between 'the record changed' and "
                           "'the toolchain moved'. Pin this job to a matching image (issue #7) or "
                           "re-derive the records deliberately and move the pin in the same change.")
              print("OK: toolchain matches the pin — so a MISMATCH below means the RECORD changed.")
          else:
              declared = set()
              for f in glob.glob("extraction/**/*.json", recursive=True):
                  try:
                      tc = (json.load(open(f, encoding="utf-8")).get("extractor") or {}).get("toolchain")
                  except Exception:
                      continue
                  if tc:
                      declared.add(tc)
              print(f"no module pin; recipes declare: {sorted(declared) or 'none (all passthrough)'}"
                    f"  ·  runtime: poppler {ver}")
              wrong = sorted(t for t in declared if t != f"poppler {ver}")
              if wrong:
                  sys.exit(f"FAIL: recipes were derived under {wrong}, but the runtime is poppler {ver}. "
                           "A MISMATCH below would be ambiguous between 'the record changed' and 'the "
                           "toolchain moved'. Pin this job to a matching image (issue #7) or re-derive "
                           "the affected records deliberately and update their recipes in the same change.")
              print("OK: every toolchain recorded in the recipes matches the runtime.")
          PY
      - name: Verify content re-derivation from originals
        run: python3 scripts/repro_gate.py  # walks authoritative/, applies scripts/repro-policy.json; exits non-zero on any mismatch/error/uncovered-over-ceiling
