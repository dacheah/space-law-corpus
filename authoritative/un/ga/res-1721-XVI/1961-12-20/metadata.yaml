provenance_note: 'English text of Parts A and B of General Assembly resolution 1721 (XVI), ''International
  co-operation in the peaceful uses of outer space'', adopted unanimously at the 1085th plenary meeting
  on 20 December 1961. SCOPE OF THIS RECORD: Parts A and B only. Resolution 1721 (XVI) was adopted in
  five parts (A-E) at the same meeting; Part C concerns meteorological science and technology (WMO) and
  Part D concerns communication by means of satellites (ITU), which fall outside this corpus''s declared
  scope boundary (docs/design/05), and Part E likewise concerns those adjacent matters. UNOOSA''s own
  official compilation reproduces only Parts A and B as the space-law-relevant parts, and that editorial
  line is followed here; Parts C-E are recorded as a deliberate, documented scope decision rather than
  silently omitted. SOURCE: the text is taken from UNOOSA''s consolidated official publication ''International
  Space Law: United Nations Instruments'' (ST/SPACE/61/Rev.3, 2025), Part three, section A, which is held
  in this corpus byte-exact as original.pdf - the same official artefact and the same standard used for
  the five GA principle instruments. RECORD COPY: the UN Official Document System copy (A/RES/1721(XVI))
  was independently retrieved on 2026-07-25 and is hash-pinned in corroborating_sources, but is a scan
  whose OCR layer is corrupt and therefore unusable as an authoritative text; it was used only to confirm
  metadata (title spelling, Part A-E structure, plenary meeting). TITLE: the 1961 record copy prints the
  title with the hyphenated ''co-operation''; ST/SPACE/61/Rev.3 modernises it to ''cooperation''. The
  stored text follows the source used (ST/SPACE/61), and the original spelling is preserved in the official_citation
  and here. FIDELITY: ''Requests The Secretary-General'' in Part B paragraph 2 carries a capital ''The''
  in the source; it is reproduced faithfully rather than silently corrected. text.txt is cleaned (page
  numbers removed, end-of-line hyphenation rejoined, paragraphs reflowed). VERIFIED on the day of ingestion
  against the stored compilation PDF at 99.2% word overlap, the only divergences being the three documented
  hyphenation rejoins (''impor-tant'', ''better-ment'', ''informa-tion''); see the verification record.'
