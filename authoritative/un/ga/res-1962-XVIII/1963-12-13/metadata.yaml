provenance_note: 'English text of the Declaration of Legal Principles Governing the Activities of States
  in the Exploration and Use of Outer Space, adopted by UN General Assembly resolution 1962 (XVIII) of
  13 December 1963. SOURCE: UNOOSA consolidated official publication ''International Space Law: United
  Nations Instruments'' (ST/SPACE/61/Rev.3, 2025), retrieved 2026-07-02 as a PDF and text-extracted by
  the fetch tool because the individual UNOOSA principle HTML pages were unfetchable. UN General Assembly
  resolutions are issued in the six official UN languages (Arabic, Chinese, English, French, Russian,
  Spanish), all equally authoritative; the English text is stored. original.txt is the raw PDF-extracted
  text for this instrument''s pages; text.txt is cleaned (page numbers and footnote markers removed, soft
  hyphenation rejoined, paragraphs reflowed). FIDELITY: extracted_unverified - PDF extraction may carry
  minor spacing artifacts; verification against the official text is a tracked follow-on.'
